[project]
name = "worldcup-2026-predictor"
version = "0.1.0"
description = "Dynamic FIFA World Cup 2026 prediction engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alex Masero", email = "amaseroaragon@gmail.com" }
]

dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "streamlit>=1.20.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
